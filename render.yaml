services:
  - type: web
    name: food-ordering-system
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DNS_SERVERS
        value: 1.1.1.1,8.8.8.8
      - key: MONGODB_URI
        sync: false
